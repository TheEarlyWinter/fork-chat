<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>分叉对话 - Fork Chat</title>
  <link rel="stylesheet" href="./assets/panel.css">
</head>
<body>
  <div class="canvas-app">
    <!-- 顶部极简控制条 -->
    <header class="canvas-header">
      <div class="header-left">
        <span class="brand-tag">FORK CHAT / NON-LINEAR</span>
        <h1 class="brand-title">分叉对话</h1>
        <span class="meta-badge" id="badge-stats">1 卡片 · 0 追问分支</span>
      </div>
      <div class="header-center">
        <span class="hint-text" id="active-agent-display">当前助手: 正在连接...</span>
      </div>
      <div class="header-right">
        <button class="btn btn-outline" id="btn-reset-view">居中视野</button>
        <button class="btn btn-primary" id="btn-new-root">+ 新对话卡片</button>
      </div>
    </header>

    <div class="session-strip">
      <span id="session-status" role="status" aria-live="polite">正在恢复会话…</span>
      <button class="btn btn-outline" id="btn-retry-save" type="button" hidden>重试保存</button>
      <button class="btn btn-outline" id="btn-save-copy" type="button" hidden>保存副本</button>
    </div>

    <!-- 主视口：无限画布层 -->
    <main class="canvas-viewport" id="viewport">
      <!-- 变换容器（平移与缩放） -->
      <div class="canvas-surface" id="surface">
        <!-- SVG 贝塞尔曲线连线层 -->
        <svg class="connectors-layer" id="connectors-svg"></svg>
        <!-- 卡片实体挂载层 -->
        <div class="cards-layer" id="cards-layer"></div>
      </div>

      <!-- 视口底部浮动缩放微件 -->
      <div class="floating-zoom-bar">
        <button class="zoom-btn" id="btn-zoom-out">-</button>
        <span class="zoom-level mono" id="zoom-text">100%</span>
        <button class="zoom-btn" id="btn-zoom-in">+</button>
      </div>
    </main>
  </div>

  <dialog class="session-delete-dialog" id="delete-session-dialog" aria-labelledby="delete-dialog-title" aria-describedby="delete-dialog-desc">
    <h2 id="delete-dialog-title">删除会话？</h2>
    <p id="delete-target-title" class="delete-target-title"></p>
    <p id="delete-dialog-desc">此会话的全部分支和消息将被删除，此操作不可撤销。不会删除 Hana 原生聊天记录。</p>
    <p id="delete-dialog-progress"></p>
    <p id="delete-dialog-error" role="alert"></p>
    <div class="delete-dialog-actions">
      <button class="btn btn-outline" id="btn-delete-cancel" type="button" autofocus>取消</button>
      <button class="btn btn-danger" id="btn-delete-confirm" type="button">确认删除</button>
    </div>
  </dialog>
  <script type="module" src="./assets/panel.js"></script>
</body>
</html>
