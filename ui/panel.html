<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>分叉对话 - Fork Chat</title>
  <link rel="stylesheet" href="./assets/panel.css">
</head>
<body>
  <div class="canvas-app">
    <!-- 顶部极简控制条 -->
    <header class="canvas-header">
      <div class="header-left">
        <span class="brand-tag">FORK CHAT / NON-LINEAR</span>
        <h1 class="brand-title">分叉对话</h1>
        <span class="meta-badge" id="badge-stats">1 卡片 · 0 追问分支</span>
      </div>
      <div class="header-center">
        <span class="hint-text" id="active-agent-display">当前助手: 正在连接...</span>
      </div>
      <div class="header-right">
        <button class="btn btn-outline" id="btn-auto-tidy" title="自动整理树状排版 (Shift+A)">整理</button>
        <button class="btn btn-outline" id="btn-reset-view">居中视野</button>
        <button class="btn btn-primary" id="btn-new-root">+ 新对话卡片</button>
      </div>
    </header>

    <div class="session-strip">
      <span id="session-status" role="status" aria-live="polite">正在恢复会话…</span>
      <button class="btn btn-outline" id="btn-retry-save" type="button" hidden>重试保存</button>
      <button class="btn btn-outline" id="btn-save-copy" type="button" hidden>保存副本</button>
    </div>

    <!-- 主视口：无限画布层 -->
    <main class="canvas-viewport" id="viewport">
      <!-- 变换容器（平移与缩放） -->
      <div class="canvas-surface" id="surface">
        <!-- SVG 贝塞尔曲线连线层 -->
        <svg class="connectors-layer" id="connectors-svg"></svg>
        <!-- 卡片实体挂载层 -->
        <div class="cards-layer" id="cards-layer"></div>
      </div>

      <!-- 视口底部浮动缩放微件 -->
      <div class="floating-zoom-bar">
        <button class="zoom-btn" id="btn-zoom-out">-</button>
        <span class="zoom-level mono" id="zoom-text">100%</span>
        <button class="zoom-btn" id="btn-zoom-in">+</button>
      </div>
    </main>
  </div>

  <dialog class="session-delete-dialog" id="delete-session-dialog" aria-labelledby="delete-dialog-title" aria-describedby="delete-dialog-desc">
    <h2 id="delete-dialog-title">删除会话？</h2>
    <p id="delete-target-title" class="delete-target-title"></p>
    <p id="delete-dialog-desc">此会话的全部分支和消息将被删除，此操作不可撤销。不会删除 Hana 原生聊天记录。</p>
    <p id="delete-dialog-progress"></p>
    <p id="delete-dialog-error" role="alert"></p>
    <div class="delete-dialog-actions">
      <button class="btn btn-outline" id="btn-delete-cancel" type="button" autofocus>取消</button>
      <button class="btn btn-danger" id="btn-delete-confirm" type="button">确认删除</button>
    </div>
  </dialog>

  <!-- 多模型横向推导 / 对抗对话框（纯白极简规范） -->
  <dialog class="battle-dialog" id="battle-dialog" aria-labelledby="battle-dialog-title" aria-describedby="battle-dialog-desc">
    <div class="battle-dialog-header">
      <div class="battle-dialog-title-box">
        <span class="battle-tag mono">BATTLE / BENCHMARK</span>
        <h2 id="battle-dialog-title">多模型横向推导</h2>
      </div>
      <button class="battle-dialog-close" id="btn-battle-close" type="button" aria-label="关闭">×</button>
    </div>
    <p id="battle-dialog-desc" class="battle-dialog-desc">在当前上下文基础上，并发拉出多条独立分支同台推导。</p>
    
    <div class="battle-form-section">
      <div class="battle-section-header">
        <label class="battle-label mono" for="battle-prompt-input">推导问题 / PROMPT</label>
        <button class="battle-link-btn mono" id="btn-use-last-prompt" type="button">引用父级上一问</button>
      </div>
      <textarea class="battle-prompt-input" id="battle-prompt-input" rows="3" placeholder="输入本次需要多模型对比推导的问题..."></textarea>
    </div>

    <div class="battle-form-section">
      <div class="battle-section-header">
        <label class="battle-label mono">选择对比助手 / AGENTS (可多选)</label>
        <span class="battle-selected-count mono" id="battle-selected-count">已选 0 个</span>
      </div>
      <div class="battle-agents-list" id="battle-agents-list" role="group" aria-label="对比助手列表">
        <!-- 动态渲染助手列表 -->
      </div>
      <div class="battle-dialog-error" id="battle-dialog-error" role="alert"></div>
    </div>

    <div class="battle-dialog-actions">
      <button class="btn btn-outline" id="btn-battle-cancel" type="button">取消</button>
      <button class="btn btn-primary" id="btn-battle-submit" type="button">开始并发推导</button>
    </div>
  </dialog>
  <script type="module" src="./assets/panel.js"></script>
</body>
</html>
